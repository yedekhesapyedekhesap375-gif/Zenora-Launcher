name: Build Zenora Network APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure project structure exists
        run: |
          mkdir -p app/src/main/java/network/zenora/launcher
          mkdir -p app/src/main/res/layout

          if [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZenoraNetworkMobile"
          include(":app")
          EOF
          fi

          if [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          fi

          if [ ! -f "gradle.properties" ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "network.zenora.launcher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "network.zenora.launcher"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="Zenora Network"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          if [ ! -f "app/src/main/res/layout/activity_main.xml" ]; then
            cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0B0E14"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:id="@+id/txtProfileName"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Oyuncu"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp" />

              <EditText
                  android:id="@+id/edtUsername"
                  android:layout_width="match_parent"
                  android:layout_height="44dp"
                  android:hint="Kullanıcı adı"
                  android:textColor="#FFFFFF"
                  android:textColorHint="#64748B" />

              <Button
                  android:id="@+id/btnSaveAccount"
                  android:layout_width="match_parent"
                  android:layout_height="44dp"
                  android:text="Kaydet" />

              <TextView
                  android:id="@+id/txtRamValue"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="RAM: 2048 MB"
                  android:textColor="#CBD5E1" />

              <SeekBar
                  android:id="@+id/seekRam"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content" />

              <CheckBox
                  android:id="@+id/chkAutoConnect"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:checked="true"
                  android:text="Otomatik Bağlan (185.158.151.45)"
                  android:textColor="#CBD5E1" />

              <EditText
                  android:id="@+id/edtSearch"
                  android:layout_width="match_parent"
                  android:layout_height="44dp"
                  android:hint="Modrinth ara"
                  android:textColor="#FFFFFF"
                  android:textColorHint="#64748B" />

              <Button
                  android:id="@+id/btnTypeMod"
                  android:layout_width="wrap_content"
                  android:layout_height="40dp"
                  android:text="Modlar" />

              <Button
                  android:id="@+id/btnTypeRp"
                  android:layout_width="wrap_content"
                  android:layout_height="40dp"
                  android:text="Resource Pack" />

              <Button
                  android:id="@+id/btnSearch"
                  android:layout_width="wrap_content"
                  android:layout_height="40dp"
                  android:text="Ara" />

              <TextView
                  android:id="@+id/txtStatus"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Hazır"
                  android:textColor="#94A3B8" />

              <LinearLayout
                  android:id="@+id/listResults"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical" />

              <Button
                  android:id="@+id/btnPlay"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:text="OYNA (ZENORA NETWORK)" />
          </LinearLayout>
          EOF
          fi

          if [ ! -f "app/src/main/java/network/zenora/launcher/ZenoraConfig.kt" ]; then
            cat << 'EOF' > app/src/main/java/network/zenora/launcher/ZenoraConfig.kt
          package network.zenora.launcher

          object ZenoraConfig {
              const val SERVER_NAME = "Zenora Network"
              const val SERVER_IP = "185.158.151.45"
              const val SERVER_PORT = 25565
              const val DEFAULT_MC_VERSION = "1.20.4"
              const val MODRINTH_API = "https://api.modrinth.com/v2"
          }
          EOF
          fi

          if [ ! -f "app/src/main/java/network/zenora/launcher/MainActivity.kt" ]; then
            cat << 'EOF' > app/src/main/java/network/zenora/launcher/MainActivity.kt
          package network.zenora.launcher

          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val edtUsername = findViewById<EditText>(R.id.edtUsername)
                  val txtProfileName = findViewById<TextView>(R.id.txtProfileName)
                  val txtStatus = findViewById<TextView>(R.id.txtStatus)

                  findViewById<Button>(R.id.btnSaveAccount).setOnClickListener {
                      val name = edtUsername.text.toString().trim()
                      if (name.isNotEmpty()) {
                          txtProfileName.text = name
                          txtStatus.text = "Hesap seçildi: $name"
                      }
                  }

                  findViewById<Button>(R.id.btnPlay).setOnClickListener {
                      txtStatus.text = "Zenora Network (${ZenoraConfig.SERVER_IP}) hazır"
                  }
              }
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Generate Wrapper & Build APK
        run: |
          gradle wrapper --gradle-version 8.5 --distribution-type bin --no-daemon
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZenoraNetwork-APK
          path: app/build/outputs/apk/debug/*.apk
